name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Paket "tools" sudah dihapus Google; platform & build-tools diunduh otomatis oleh AGP.
          packages: platform-tools

      - name: Siapkan Gradle (dengan cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Pasang keystore release dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi. APK release akan dibangun TANPA tanda tangan."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "YUKLIVE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "YUKLIVE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "YUKLIVE_KEY_ALIAS=$KEY_ALIAS"
            echo "YUKLIVE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug & release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: YukLive-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: YukLive-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Hapus keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
